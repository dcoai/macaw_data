# CI for macaw_data: the hard gate that keeps main green. Every push and
# merge request runs the checks the work-item skills require locally, plus
# American spelling. Group runner tagged DCOTek, pinned hexpm image so a
# toolchain bump is a deliberate commit.

variables:
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim

default:
  tags:
    - DCOTek
  interruptible: true

stages:
  - check
  - test

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
  before_script:
    # macaw_layers is a git dependency, fetched over HTTPS with this job's token: the image
    # has no git, and the SSH URL in mix.exs needs a key CI lacks. macaw_layers allowlists
    # this project's job token.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.conet.yarina.org/".insteadOf "git@gitlab.conet.yarina.org:"
    - mix local.hex --force
    - mix local.rebar --force
    # Compiled dependencies come from the group's depdep store (scripts/depdep.exs,
    # spec/00 §4.1 of macaw_compose). A store that can't be reached falls back to a
    # bare deps.get; with --mix-get, deps.get's own failure is this line's failure.
    - elixir scripts/depdep.exs --pull --mix-get --compile-deps || mix deps.get

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

compile:
  extends: .elixir
  stage: check
  script:
    - mix compile --force --warnings-as-errors
    # As an app without the optional table and nx compiles it: a call into either
    # must be silenced where it is guarded, or every such app warns (#7). Without zigler
    # too, so with the native kernels' stub (spec/04 §1.7). In dev, not prod: the flag skips
    # zigler but still compiles its zig_doc, which needs ex_doc, a dev and test dependency.
    - MIX_ENV=dev mix compile --force --no-optional-deps --warnings-as-errors
    # Push what the store lacked, only after a green build.
    - elixir scripts/depdep.exs --push || echo "depdep bootstrap failed - nothing pushed"

spelling:
  image: $ELIXIR_IMAGE
  stage: check
  script:
    - elixir ci/spelling.exs

# No atom from untrusted input (ci/atoms.exs, spec/02 §6.5): a gate the sandbox brought.
atoms:
  image: $ELIXIR_IMAGE
  stage: check
  script:
    - elixir ci/atoms.exs

# Every spec link resolves (ci/spec_links.exs): links into another Macaw
# repository's spec are checked by shape here, where no sibling checkout exists.
spec-links:
  image: $ELIXIR_IMAGE
  stage: check
  script:
    - elixir ci/spec_links.exs

# The native kernels (spec/04 §1.7) need Zig of the version Zigler targets: `mix zig.get`
# fetches it from ziglang.org into Zigler's cache, where the build finds it (tar.xz, so
# xz-utils). Every job without this has no Zig and runs the Elixir path.
.zig:
  extends: .elixir
  before_script:
    - !reference [.elixir, before_script]
    - apt-get install -y -qq --no-install-recommends xz-utils > /dev/null
    - mix zig.get

# With the toolchain, under `native: :required`: a kernel that fails to build or load fails
# the job, and every test runs against the kernels.
test:
  extends: .zig
  stage: test
  variables:
    MACAW_DATA_NATIVE: required
  script:
    - mix compile --warnings-as-errors
    - mix test
    # Spec, tests and code aligned (macaw_compose spec/00 §4.1): the status reads this
    # job's test run as evidence, so it runs right after it, in the same job.
    - mix surfex.status

# Without the toolchain: the build warns and passes, and every step runs its Elixir path,
# whose tests must pass as they do with the kernels.
test-elixir:
  extends: .elixir
  stage: test
  script:
    - mix compile --warnings-as-errors
    - mix test

# `native: :required` and no toolchain: the build must fail, and for that reason.
native-required:
  extends: .elixir
  stage: test
  variables:
    MACAW_DATA_NATIVE: required
  script:
    - 'mix compile > compile.log 2>&1 && { cat compile.log; echo "built without Zig under native required"; exit 1; } || true'
    - cat compile.log
    - 'grep -F "native: :required, but the native kernels can''t be built" compile.log'
